<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>ProAssist — Asistente de Productividad</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0c0c0f; --surface: #15151a; --surface2: #1e1e26;
      --border: rgba(255,255,255,0.07); --accent: #7c6af7; --accent2: #4fc4a0;
      --text: #f0eff8; --muted: #7a798a;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .logo-text { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 18px; }
    .logo-text span { color: var(--accent); }
    .badge { font-size: 11px; color: var(--accent2); background: rgba(79,196,160,0.1); border: 1px solid rgba(79,196,160,0.2); padding: 3px 10px; border-radius: 20px; }
    #chat-window { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.2rem; scroll-behavior: smooth; }
    #chat-window::-webkit-scrollbar { width: 4px; }
    #chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .message { display: flex; gap: 10px; animation: fadeUp 0.25s ease forwards; max-width: 85%; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.bot { align-self: flex-start; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; margin-top: 2px; }
    .message.user .avatar { background: rgba(124,106,247,0.15); border: 1px solid rgba(124,106,247,0.3); }
    .message.bot .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    
    .msg-content { display: flex; flex-direction: column; max-width: 100%; }
    .bubble { padding: 0.75rem 1rem; border-radius: 14px; font-size: 14px; line-height: 1.65; word-break: break-word; }
    .message.user .bubble { background: #1f1d35; border: 1px solid rgba(124,106,247,0.2); border-bottom-right-radius: 4px; white-space: pre-wrap; }
    .message.bot .bubble { background: #141420; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .message.bot .bubble h1, .message.bot .bubble h2, .message.bot .bubble h3, .message.bot .bubble h4 { font-family: 'Syne', sans-serif; color: var(--text); margin: 0.8rem 0 0.35rem; font-weight: 700; line-height: 1.3; }
    .message.bot .bubble h1:first-child, .message.bot .bubble h2:first-child, .message.bot .bubble h3:first-child, .message.bot .bubble h4:first-child { margin-top: 0; }
    .message.bot .bubble h1 { font-size: 17px; color: var(--accent); }
    .message.bot .bubble h2 { font-size: 16px; color: var(--accent); }
    .message.bot .bubble h3 { font-size: 15px; color: #a496f8; }
    .message.bot .bubble h4 { font-size: 14px; font-weight: 600; }
    .message.bot .bubble p { margin-bottom: 0.55rem; }
    .message.bot .bubble p:last-child { margin-bottom: 0; }
    .message.bot .bubble strong { font-weight: 700; color: #ffffff; }
    .message.bot .bubble em { font-style: italic; opacity: 0.9; }
    .message.bot .bubble ul, .message.bot .bubble ol { margin: 0.4rem 0 0.6rem 1.25rem; padding: 0; }
    .message.bot .bubble li { margin-bottom: 0.25rem; }
    .message.bot .bubble hr { border: none; border-top: 1px solid var(--border); margin: 0.8rem 0; }
    .message.bot .bubble code { background: rgba(124,106,247,0.15); border: 1px solid rgba(124,106,247,0.25); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 12.5px; color: #c9c3fa; }
    
    .pre-container { position: relative; margin: 0.7rem 0; }
    .pre-copy-btn { position: absolute; top: 6px; right: 6px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: var(--muted); padding: 3px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .pre-copy-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .pre-copy-btn.copied { color: var(--accent2); border-color: var(--accent2); }

    .message.bot .bubble pre { background: #0b0b10; border: 1px solid var(--border); padding: 1rem 0.85rem 0.85rem; border-radius: 8px; overflow-x: auto; margin: 0; }
    .message.bot .bubble pre code { background: transparent; border: none; padding: 0; color: var(--text); }
    
    .msg-toolbar { display: flex; gap: 6px; margin-top: 4px; padding: 0 4px; opacity: 0; transition: opacity 0.2s; }
    .message:hover .msg-toolbar, .message:focus-within .msg-toolbar { opacity: 1; }
    .copy-msg-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
    .copy-msg-btn:hover { background: var(--surface2); color: var(--text); border-color: rgba(124,106,247,0.4); }
    .copy-msg-btn.copied { color: var(--accent2); border-color: var(--accent2); }

    .typing .bubble { display: flex; align-items: center; gap: 4px; padding: 0.75rem 1rem; }
    .dot { width: 7px; height: 7px; background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100% { transform: scale(0.7); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    
    .welcome { text-align: center; padding: 2rem 1rem; animation: fadeUp 0.4s ease forwards; }
    .welcome h2 { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 0.5rem; }
    .welcome p { color: var(--muted); font-size: 14px; margin-bottom: 1.5rem; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .suggestion-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 8px 14px; border-radius: 20px; cursor: pointer; transition: all 0.2s; }
    .suggestion-btn:hover { border-color: var(--accent); color: var(--accent); }
    
    .input-area { padding: 1rem 1.5rem; padding-bottom: max(1rem, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
    .input-row { display: flex; gap: 10px; align-items: flex-end; background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 8px 8px 8px 14px; transition: border-color 0.2s; }
    .input-row:focus-within { border-color: rgba(124,106,247,0.4); }
    #user-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; resize: none; max-height: 120px; line-height: 1.5; padding: 4px 0; }
    #user-input::placeholder { color: var(--muted); }
    
    .controls { display: flex; gap: 6px; align-items: center; }
    .char-badge { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; display: none; padding: 0 4px; user-select: none; }
    .char-badge.visible { display: inline-block; }
    .char-badge.warn { color: #f59e0b; }
    .char-badge.limit { color: #ef4444; }

    #reset-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    #reset-btn:hover { border-color: #e05f5f; color: #e05f5f; }
    #send-btn { background: linear-gradient(135deg, var(--accent), #5a4fd4); border: none; color: white; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s, transform 0.1s; }
    #send-btn:hover { opacity: 0.88; }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    footer { text-align: center; font-size: 11px; color: var(--muted); padding: 8px 0 4px; }
  </style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon" aria-hidden="true">⚡</div>
    <div class="logo-text">Pro<span>Assist</span></div>
  </div>
  <span class="badge" aria-label="Estado del sistema: IA activa">IA activa</span>
</header>

<div id="chat-window" role="log" aria-live="polite" aria-label="Historial de mensajes de chat">
  <div class="welcome" id="welcome">
    <h2>Hola, soy ProAssist 👋</h2>
    <p>Tu asistente de productividad personal. ¿En qué te ayudo hoy?</p>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="sendSuggestion(this)">📋 Organizar mi día</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">🎯 Definir mis metas</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">⏱ Técnica Pomodoro</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">💡 Dame motivación</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="user-input" rows="1" maxlength="1000" placeholder="Escribe algo... / Type something..." aria-label="Escribe tu mensaje para ProAssist"></textarea>
    <div class="controls">
      <span id="char-count" class="char-badge" aria-live="polite"></span>
      <button id="reset-btn" title="Nueva conversación" aria-label="Reiniciar conversación" onclick="resetChat()">↺</button>
      <button id="send-btn" title="Enviar mensaje" aria-label="Enviar mensaje" onclick="sendMessage()">➤</button>
    </div>
  </div>
  <footer>Desarrollado por Lain Sthid Ramírez Rueda · Analista y Desarrollador de Software</footer>
</div>

<script>
  const chatWindow = document.getElementById('chat-window');
  const input = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const charBadge = document.getElementById('char-count');

  // Identificador de sesión único por pestaña/navegador (aislamiento total de chats)
  let sessionId = sessionStorage.getItem('proassist_sid');
  if (!sessionId) {
    sessionId = 'pa_' + Math.random().toString(36).substring(2, 12) + '_' + Date.now().toString(36);
    sessionStorage.setItem('proassist_sid', sessionId);
  }

  // Atajos de teclado: Enter para enviar, Shift+Enter para salto de línea
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Ajuste automático de altura del textarea y contador de caracteres
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    const len = input.value.length;
    if (len > 0) {
      charBadge.classList.add('visible');
      charBadge.textContent = `${len}/1000`;
      charBadge.className = 'char-badge visible' + (len >= 950 ? ' limit' : len >= 750 ? ' warn' : '');
    } else {
      charBadge.classList.remove('visible');
    }
  });

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function formatContent(text) {
    let rawHtml = '';
    if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
      rawHtml = marked.parse(text);
    } else {
      let html = escapeHtml(text);
      rawHtml = html
        .replace(/^#### (.*$)/gim, '<h4 style="margin:0.5rem 0;color:var(--text);">$1</h4>')
        .replace(/^### (.*$)/gim, '<h3 style="margin:0.5rem 0;color:#a496f8;">$1</h3>')
        .replace(/^## (.*$)/gim, '<h2 style="margin:0.5rem 0;color:#7c6af7;">$1</h2>')
        .replace(/^# (.*$)/gim, '<h1 style="margin:0.5rem 0;color:#7c6af7;">$1</h1>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/^\s*[\*\-]\s+(.*$)/gim, '• $1')
        .replace(/\n/g, '<br/>');
    }

    // Envolver bloques <pre><code> con botón de copiar código
    rawHtml = rawHtml.replace(/<pre><code(?:\s+class="([^"]*)")?>([\s\S]*?)<\/code><\/pre>/gi, (match, lang, code) => {
      return `<div class="pre-container"><button class="pre-copy-btn" onclick="copySnippet(this)" aria-label="Copiar código">Copiar código</button><pre><code class="${lang || ''}">${code}</code></pre></div>`;
    });

    // Sanitización anti-XSS con DOMPurify
    if (typeof DOMPurify !== 'undefined' && typeof DOMPurify.sanitize === 'function') {
      return DOMPurify.sanitize(rawHtml);
    }
    return rawHtml;
  }

  function copyMessage(btn) {
    const bubble = btn.closest('.msg-content').querySelector('.bubble');
    if (!bubble) return;
    const textToCopy = bubble.innerText || bubble.textContent;
    navigator.clipboard.writeText(textToCopy).then(() => {
      const orig = btn.innerHTML;
      btn.innerHTML = '✓ Copiado';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerHTML = orig;
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  function copySnippet(btn) {
    const codeEl = btn.parentElement.querySelector('code');
    if (!codeEl) return;
    navigator.clipboard.writeText(codeEl.innerText).then(() => {
      const orig = btn.innerText;
      btn.innerText = '✓ Copiado';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerText = orig;
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  function appendMessage(role, text) {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const formatted = role === 'bot' ? formatContent(text) : escapeHtml(text);
    const toolbar = role === 'bot' 
      ? `<div class="msg-toolbar"><button class="copy-msg-btn" onclick="copyMessage(this)" aria-label="Copiar respuesta"><span aria-hidden="true">📋</span> Copiar</button></div>`
      : '';

    msg.innerHTML = `
      <div class="avatar" aria-hidden="true">${role === 'user' ? '👤' : '⚡'}</div>
      <div class="msg-content">
        <div class="bubble">${formatted}</div>
        ${toolbar}
      </div>
    `;

    chatWindow.appendChild(msg);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function showTyping() {
    const msg = document.createElement('div');
    msg.className = 'message bot typing';
    msg.id = 'typing';
    msg.innerHTML = `
      <div class="avatar" aria-hidden="true">⚡</div>
      <div class="bubble">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    `;
    chatWindow.appendChild(msg);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    charBadge.classList.remove('visible');
    sendBtn.disabled = true;

    appendMessage('user', text);
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });
      const data = await res.json();
      removeTyping();
      appendMessage('bot', data.response || 'Error al procesar la respuesta.');
    } catch {
      removeTyping();
      appendMessage('bot', '❌ Error de conexión. Intenta de nuevo.');
    }

    sendBtn.disabled = false;
    input.focus();
  }

  function sendSuggestion(btn) {
    input.value = btn.textContent.replace(/^[^\w]+/, '').trim();
    sendMessage();
  }

  async function resetChat() {
    await fetch('/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId })
    });
    chatWindow.innerHTML = '';
    const welcome = document.createElement('div');
    welcome.className = 'welcome';
    welcome.id = 'welcome';
    welcome.innerHTML = `
      <h2>Hola, soy ProAssist 👋</h2>
      <p>Tu asistente de productividad personal. ¿En qué te ayudo hoy?</p>
      <div class="suggestions">
        <button class="suggestion-btn" onclick="sendSuggestion(this)">📋 Organizar mi día</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">🎯 Definir mis metas</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">⏱ Técnica Pomodoro</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">💡 Dame motivación</button>
      </div>
    `;
    chatWindow.appendChild(welcome);
    input.focus();
  }
</script>
</body>
</html>
